me\">0:00<\/span>\n        <input type=\"range\" id=\"progress-bar\" value=\"0\" step=\"1\" min=\"0\" max=\"100\" aria-label=\"Seek\">\n        <span id=\"total-duration\">0:00<\/span>\n    <\/div>\n    <div class=\"controls-container\">\n        <div style=\"display:flex;align-items:center;\">\n            <button id=\"volume-btn\" class=\"player-btn\" aria-label=\"Toggle mute\">\n                <svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\">\n                    <polygon points=\"11 5 6 9 2 9 2 15 6 15 11 19 11 5\"><\/polygon>\n                    <path d=\"M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07\"><\/path>\n                <\/svg>\n            <\/button>\n            <input type=\"range\" id=\"new-volume-slider\" min=\"0\" max=\"1\" step=\"0.01\" value=\"1\" aria-label=\"Volume\">\n        <\/div>\n        <div class=\"speed-container\">\n            <button id=\"speed-btn\" class=\"player-btn\">1x<\/button>\n            <div id=\"speed-options\" class=\"hidden\">\n                <div data-speed=\"0.5\">0.5x<\/div>\n                <div data-speed=\"0.75\">0.75x<\/div>\n                <div data-speed=\"1\" class=\"active\">1x<\/div>\n                <div data-speed=\"1.25\">1.25x<\/div>\n                <div data-speed=\"1.5\">1.5x<\/div>\n                <div data-speed=\"2\">2x<\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n<\/div>\n\n<audio id=\"global-audio-player\" preload=\"metadata\"\n       src=\"https://ia601002.us.archive.org/21/items/0731-1_202608/0731%281%29.MP3\"><\/audio>\n\n<div class=\"main-container\">\n    <div class=\"left-panel\">\n\n        <!-- ================= SECTION 2 ================= -->\n        <div id=\"part-2\" class=\"question-part\">\n            <div class=\"part-header\">\n                <p><strong>Section 2<\/strong><\/p>\n                <p>Listen and answer questions 11-20.<\/p>\n            <\/div>\n            <div class=\"questions-container\">\n\n                <div class=\"question\">\n                    <div class=\"question-prompt\">\n                        <p><strong>Questions 11-15<\/strong><\/p>\n                        <p>Choose the correct letter, <strong>A<\/strong>, <strong>B<\/strong> or <strong>C<\/strong>.<\/p>\n                    <\/div>\n                    <p class=\"centered-title\">Working for Johnson Jones<\/p>\n\n                    <div class=\"mcq-item\">\n                        <p class=\"q-stem\"><strong>11.<\/strong> What does Mark say first attracts people to working for Johnson Jones?<\/p>\n                        <div class=\"options\" style=\"margin-left: 20px;\">\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q11\" value=\"A\"><span class=\"opt-letter\">A<\/span> the pay<\/label><\/div>\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q11\" value=\"B\"><span class=\"opt-letter\">B<\/span> the staff discount<\/label><\/div>\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q11\" value=\"C\"><span class=\"opt-letter\">C<\/span> the working hours<\/label><\/div>\n                        <\/div>\n                    <\/div>\n\n                    <div class=\"mcq-item\">\n                        <p class=\"q-stem\"><strong>12.<\/strong> Mark says the company is one of the country's most successful retailers because it<\/p>\n                        <div class=\"options\" style=\"margin-left: 20px;\">\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q12\" value=\"A\"><span class=\"opt-letter\">A<\/span> is focused on long term planning.<\/label><\/div>\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q12\" value=\"B\"><span class=\"opt-letter\">B<\/span> provides excellent customer service.<\/label><\/div>\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q12\" value=\"C\"><span class=\"opt-letter\">C<\/span> offers value for money.<\/label><\/div>\n                        <\/div>\n                    <\/div>\n\n                    <div class=\"mcq-item\">\n                        <p class=\"q-stem\"><strong>13.<\/strong> Mark says that because Johnson Jones is a partnership, the staff<\/p>\n                        <div class=\"options\" style=\"margin-left: 20px;\">\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q13\" value=\"A\"><span class=\"opt-letter\">A<\/span> are better trained.<\/label><\/div>\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q13\" value=\"B\"><span class=\"opt-letter\">B<\/span> have better job security.<\/label><\/div>\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q13\" value=\"C\"><span class=\"opt-letter\">C<\/span> are given more responsibility.<\/label><\/div>\n                        <\/div>\n                    <\/div>\n\n                    <div class=\"mcq-item\">\n                        <p class=\"q-stem\"><strong>14.<\/strong> What is the typical annual bonus that partners receive?<\/p>\n                        <div class=\"options\" style=\"margin-left: 20px;\">\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q14\" value=\"A\"><span class=\"opt-letter\">A<\/span> 8%<\/label><\/div>\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q14\" value=\"B\"><span class=\"opt-letter\">B<\/span> 15%<\/label><\/div>\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q14\" value=\"C\"><span class=\"opt-letter\">C<\/span> 20%<\/label><\/div>\n                        <\/div>\n                    <\/div>\n\n                    <div class=\"mcq-item\">\n                        <p class=\"q-stem\"><strong>15.<\/strong> To qualify for the leisure and holiday facilities, partners must have worked for the company for<\/p>\n                        <div class=\"options\" style=\"margin-left: 20px;\">\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q15\" value=\"A\"><span class=\"opt-letter\">A<\/span> one year.<\/label><\/div>\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q15\" value=\"B\"><span class=\"opt-letter\">B<\/span> six months.<\/label><\/div>\n                            <div class=\"multi-choice-option\"><label><input type=\"radio\" name=\"q15\" value=\"C\"><span class=\"opt-letter\">C<\/span> three months<\/label><\/div>\n                        <\/div>\n                    <\/div>\n                <\/div>\n\n                <div class=\"question\">\n                    <div class=\"question-prompt\" style=\"margin-top: 40px;\">\n                        <p><strong>Questions 16-20<\/strong><\/p>\n                        <p>Choose <strong>FIVE<\/strong> answers from the box and write the correct letter, <strong>A-G<\/strong>, next to questions 16-20.<\/p>\n                        <p><em>What information is given about each of the following staff holiday centres?<\/em><\/p>\n                    <\/div>\n\n                    <div class=\"matching-key\">\n                        <div class=\"key-title\">Information<\/div>\n                        <div class=\"key-grid\">\n                            <div class=\"key-row\"><span class=\"key-letter\">A<\/span> available for celebrations and parties<\/div>\n                            <div class=\"key-row\"><span class=\"key-letter\">B<\/span> suitable for families with children<\/div>\n                            <div class=\"key-row\"><span class=\"key-letter\">C<\/span> regularly used by senior management<\/div>\n                            <div class=\"key-row\"><span class=\"key-letter\">D<\/span> also supplies food to the company's supermarkets<\/div>\n                            <div class=\"key-row\"><span class=\"key-letter\">E<\/span> spa facilities available<\/div>\n                            <div class=\"key-row\"><span class=\"key-letter\">F<\/span> similar to being in someone's home<\/div>\n                            <div class=\"key-row\"><span class=\"key-letter\">G<\/span> good for short breaks<\/div>\n                        <\/div>\n                    <\/div>\n\n                    <p class=\"question-title\">Staff Holiday Centres<\/p>\n                    <ul class=\"matching-list\">\n                        <li><span class=\"m-num\">16.<\/span><span class=\"m-text\">The Grange<\/span>\n                            <select id=\"q16\" class=\"matching-select match-select\"><\/select><\/li>\n                        <li><span class=\"m-num\">17.<\/span><span class=\"m-text\">Meadow House<\/span>\n                            <select id=\"q17\" class=\"matching-select match-select\"><\/select><\/li>\n                        <li><span class=\"m-num\">18.<\/span><span class=\"m-text\">Coombe Manor<\/span>\n                            <select id=\"q18\" class=\"matching-select match-select\"><\/select><\/li>\n                        <li><span class=\"m-num\">19.<\/span><span class=\"m-text\">The Barn<\/span>\n                            <select id=\"q19\" class=\"matching-select match-select\"><\/select><\/li>\n                        <li><span class=\"m-num\">20.<\/span><span class=\"m-text\">The Stable<\/span>\n                            <select id=\"q20\" class=\"matching-select match-select\"><\/select><\/li>\n                    <\/ul>\n                <\/div>\n\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <!-- Right Panel -->\n    <div class=\"right-panel\">\n        <div id=\"transcription-container\">\n            <h2>Transcription<\/h2>\n            <div id=\"transcription-text\"><\/div>\n        <\/div>\n    <\/div>\n<\/div>\n\n<!-- Hidden Transcription Data -->\n<div id=\"transcription-data\" style=\"display:none;\">\n    <div data-part=\"2\">\n        <strong>SECTION 2<\/strong><br><br>\n        Good morning. My name's Mark Bergin. I'm a human resources manager at Johnson Jones and I'm here to tell you about what it's like working for one of the country's best employers.<br>\n        The company has 225 department stores and owns a further 150 supermarkets. At our latest store opening, we had over 9,000 applicants for 750 posts. So, why do so many people want to work for us?<br>\n        Well, the first thing that attracts them isn't so much the salary, although that is a little above average, it's <span class=\"highlight\">the idea of getting a massive 25% off everything from washing machines to designer handbags<\/span>. People are prepared to put in long hours to get those kinds of perks. [Q11 &rarr; B]<br><br>\n\n        Johnson &amp; Jones has been going strong for nearly 150 years and has outlived many of its strongest competitors. Of course, this has something to do with the high-quality products that we sell and our motto, Better for Less, which means customers know they are getting good value for money. But we're not alone in that.<br>\n        Where we are different is in our approach to making a profit. Other companies think in the short term, whereas <span class=\"highlight\">we always take a more strategic view, looking three or five years ahead<\/span>. [Q12 &rarr; A]<br><br>\n\n        The company isn't owned by a family or shareholders. It's a partnership, which means it's owned by its full-time employees, who are all partners and have a share in the company. In return for the very generous benefits they get, they're expected to put in extra effort and <span class=\"highlight\">take an active role in running the company<\/span>. This means they're involved in things like making decisions about pension contributions, for example. [Q13 &rarr; C]<br><br>\n\n        Another very attractive reason for working for us is the annual bonus, which we get as a percentage of our salary. <span class=\"highlight\">Last year it was 15%, about two months' salary, which is pretty standard<\/span>. It can go down to 8%, but that's unusual, and a couple of times it's even been above 20%. Some people use it to pay off loans, others save it for a deposit on a house. [Q14 &rarr; B]<br><br>\n\n        The most popular benefit for partners are the subsidised holiday centres, which are owned by the company. Once a year, partners can book in for up to two weeks. It's for anyone, from cleaners to directors, with <span class=\"highlight\">a minimum of three months' service<\/span>. After six months' service, partners are entitled to a further subsidy on the cost of their stay. [Q15 &rarr; C]<br><br>\n\n        Let me just give you an idea of what's on offer at the holiday centres.<br>\n        The Grange, which is the largest of the holiday centres, is <span class=\"highlight\">regularly used by senior management<\/span>. It's all very informal, not like a normal conference centre. [Q16 The Grange &rarr; C]<br>\n        Meadow House is located in Kent, which is famous for its apples and other fruit, and it's a large country house. What's unusual about it is that, unlike other hotels, <span class=\"highlight\">you have access to the kitchen, so it feels more like staying with a friend<\/span>. [Q17 Meadow House &rarr; F]<br>\n        Coombe Manor is a working farm. There are loads of cows and sheep, none of which actually end up on our supermarket shelves. <span class=\"highlight\">It's a paradise for kids, as there's plenty of space to run wild and also an indoor pool<\/span>. You can choose to stay in cottages or camp by the lake. [Q18 Coombe Manor &rarr; B]<br>\n        The Barn is where I recently celebrated my 25th wedding anniversary. <span class=\"highlight\">You can rent the whole place out for a large group of up to 40 friends<\/span>. We got all our food delivered from the nearest Johnson Jones supermarket, so there was no cooking to be done. Perfect. All that was missing was the spa, which should be opening next year. [Q19 The Barn &rarr; A]<br>\n        The Stable is often hard to get into because it's so popular. That's partly because it's right on the beach with beautiful sea views and <span class=\"highlight\">only an hour by train from London. Ideal for weekends<\/span>. The company Sailing Club is located there, which was started by the company's founder in 1885. [Q20 The Stable &rarr; G]\n    <\/div>\n<\/div>\n\n<!-- Hidden Answer Key -->\n<div id=\"answer-key\" style=\"display:none;\">\n    <p>11. B | 12. A | 13. C | 14. B | 15. C<\/p>\n    <p>16. C | 17. F | 18. B | 19. A | 20. G<\/p>\n<\/div>\n\n<div class=\"nav-arrows\">\n    <button class=\"nav-arrow\" onclick=\"previousQuestion()\" id=\"prevBtn\">&lsaquo;<\/button>\n    <button class=\"nav-arrow\" onclick=\"nextQuestion()\" id=\"nextBtn\">&rsaquo;<\/button>\n<\/div>\n\n<nav class=\"nav-row perScorableItem\" aria-label=\"Questions\">\n    <div class=\"footer__questionWrapper__1tZ46 selected multiple\" role=\"tablist\">\n        <button role=\"tab\" class=\"footer__questionNo__3WNct\">\n            <span><span class=\"section-prefix\">Part <\/span><span class=\"sectionNr\">2<\/span><span class=\"attemptedCount\">0 of 10<\/span><\/span>\n        <\/button>\n        <div class=\"footer__subquestionWrapper__9GgoP\" id=\"subwrap-2\"><\/div>\n    <\/div>\n    <button id=\"deliver-button\" aria-label=\"Review your answers\" class=\"footer__deliverButton__3FM07\">\n        <span>Check Answers<\/span>\n    <\/button>\n<\/nav>\n\n<div id=\"selection-toolbar\">\n    <button onclick=\"applyHighlight()\">Highlight<\/button>\n    <button class=\"secondary\" onclick=\"addComment()\">Note<\/button>\n    <button class=\"secondary\" onclick=\"clearSelectionHighlight()\">Clear<\/button>\n<\/div>\n\n<div id=\"result-modal\" class=\"modal-overlay\" style=\"display: none;\">\n    <div class=\"modal-content\">\n        <div class=\"modal-header\">\n            <h2>Your Results<\/h2>\n            <button id=\"modal-close-button\" class=\"modal-close-btn\">&times;<\/button>\n        <\/div>\n        <div class=\"modal-body\">\n            <p id=\"score-summary\"><\/p>\n            <div id=\"result-details\"><\/div>\n        <\/div>\n    <\/div>\n<\/div>\n\n<script>\nconst MIN_Q = 11, MAX_Q = 20;\nlet currentQuestion = MIN_Q;\nlet currentSelectionRange = null;\n\nconst body = document.body;\nconst darkModeToggle = document.getElementById('dark-mode-toggle');\nconst fontSizeToggle = document.getElementById('font-size-toggle');\nconst fontSizeOptions = document.getElementById('font-size-options');\nconst selToolbar = document.getElementById('selection-toolbar');\n\n/* ===== Answer key ===== */\nconst correctAnswers = {\n    q11: 'B', q12: 'A', q13: 'C', q14: 'B', q15: 'C',\n    q16: 'C', q17: 'F', q18: 'B', q19: 'A', q20: 'G'\n};\n\nconst questionTypes = {\n    q11:'mcq', q12:'mcq', q13:'mcq', q14:'mcq', q15:'mcq',\n    q16:'select', q17:'select', q18:'select', q19:'select', q20:'select'\n};\n\n/* ===== Populate select options (A-G) ===== */\nfunction populateSelects() {\n    const matchLetters = ['A','B','C','D','E','F','G'];\n    const build = (arr) => '<option value=\"\"><\/option>' + arr.map(l => `<option value=\"${l}\">${l}<\/option>`).join('');\n    document.querySelectorAll('.match-select').forEach(s => s.innerHTML = build(matchLetters));\n}\n\n/* ===== Build footer sub-question buttons (11-20) ===== */\nfunction buildSubQuestions() {\n    const wrap = document.getElementById('subwrap-2');\n    let html = '';\n    for (let q = MIN_Q; q <= MAX_Q; q++) {\n        html += `<button class=\"subQuestion scorable-item\" data-q=\"${q}\" onclick=\"goToQuestion(${q})\">\n                    <span class=\"sr-only\">Question ${q}<\/span><span aria-hidden=\"true\">${q}<\/span><\/button>`;\n    }\n    wrap.innerHTML = html;\n}\n\n/* ===== Theme / font ===== */\nfunction initDarkMode() { body.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); }\nfunction toggleDarkMode() {\n    const isDark = body.getAttribute('data-theme') === 'dark';\n    body.setAttribute('data-theme', isDark ? 'light' : 'dark');\n    localStorage.setItem('theme', isDark ? 'light' : 'dark');\n}\nfunction changeFontSize(size) {\n    body.classList.remove('font-small', 'font-medium', 'font-large', 'font-xlarge');\n    body.classList.add(`font-${size}`);\n    localStorage.setItem('fontSize', size);\n    fontSizeOptions.classList.remove('show');\n}\nfunction initFontSize() { changeFontSize(localStorage.getItem('fontSize') || 'medium'); }\n\n/* ===== Transcription loader (results mode) ===== */\nfunction loadTranscription() {\n    if (!document.querySelector('.main-container.results-mode')) return;\n    const src = document.querySelector('#transcription-data [data-part=\"2\"]');\n    const tgt = document.getElementById('transcription-text');\n    if (src && tgt) tgt.innerHTML = src.innerHTML;\n}\n\n/* ===== Navigation ===== */\nfunction anchorFor(n) {\n    return document.getElementById(`q${n}`) || document.querySelector(`input[name=\"q${n}\"]`);\n}\n\nfunction goToQuestion(questionNumber) {\n    if (questionNumber < MIN_Q || questionNumber > MAX_Q) return;\n    currentQuestion = questionNumber;\n\n    document.querySelectorAll('.subQuestion').forEach(btn => btn.classList.remove('active'));\n    const questionBtn = document.querySelector(`.subQuestion[data-q=\"${questionNumber}\"]`);\n    if (questionBtn) questionBtn.classList.add('active');\n\n    const el = anchorFor(questionNumber);\n    if (el) {\n        const container = el.closest('.mcq-item') || el.closest('li') || el.closest('.question') || el;\n        if (container) {\n            container.scrollIntoView({ behavior: 'smooth', block: 'center' });\n            const flashTarget = el.closest('.mcq-item') || el.closest('li') || el.closest('.question') || el;\n            if (flashTarget) {\n                flashTarget.classList.add('flash');\n                setTimeout(() => flashTarget.classList.remove('flash'), 1000);\n            }\n        }\n    }\n    updateNavigation();\n}\n\nfunction updateNavigation() {\n    updateAttemptedCount();\n    document.getElementById('prevBtn').disabled = currentQuestion === MIN_Q;\n    document.getElementById('nextBtn').disabled = currentQuestion === MAX_Q;\n}\n\nfunction nextQuestion() { if (currentQuestion < MAX_Q) goToQuestion(currentQuestion + 1); }\nfunction previousQuestion() { if (currentQuestion > MIN_Q) goToQuestion(currentQuestion - 1); }\n\n/* ===== Answered tracking ===== */\nfunction isQuestionAnswered(qNum) {\n    const el = document.getElementById(`q${qNum}`);\n    if (el && el.tagName === 'SELECT') return el.value.trim() !== '';\n    return !!document.querySelector(`input[name=\"q${qNum}\"]:checked`);\n}\n\nfunction updateAnsweredIndicators() {\n    for (let q = MIN_Q; q <= MAX_Q; q++) {\n        const btn = document.querySelector(`.subQuestion[data-q=\"${q}\"]`);\n        if (!btn || btn.classList.contains('correct') || btn.classList.contains('incorrect')) continue;\n        btn.classList.toggle('answered', isQuestionAnswered(q));\n    }\n}\n\nfunction updateAttemptedCount() {\n    let answered = 0;\n    for (let q = MIN_Q; q <= MAX_Q; q++) if (isQuestionAnswered(q)) answered++;\n    const el = document.querySelector('.attemptedCount');\n    if (el) el.textContent = `${answered} of 10`;\n}\n\n/* ===== Highlighting ===== */\nfunction saveSelection() {\n    const sel = window.getSelection();\n    if (sel && sel.rangeCount > 0 && !sel.isCollapsed && sel.toString().trim() !== '') {\n        currentSelectionRange = sel.getRangeAt(0).cloneRange();\n        return true;\n    }\n    return false;\n}\n\nfunction showSelectionToolbar() {\n    const sel = window.getSelection();\n    if (!sel || sel.rangeCount === 0 || sel.isCollapsed || sel.toString().trim() === '') { hideSelectionToolbar(); return; }\n    const range = sel.getRangeAt(0);\n    const rect = range.getBoundingClientRect();\n    if (rect.width === 0 && rect.height === 0) { hideSelectionToolbar(); return; }\n    currentSelectionRange = range.cloneRange();\n\n    selToolbar.style.display = 'flex';\n    let top = window.scrollY + rect.top - selToolbar.offsetHeight - 8;\n    let left = window.scrollX + rect.left + rect.width / 2 - selToolbar.offsetWidth / 2;\n    if (top < window.scrollY + 5) top = window.scrollY + rect.bottom + 8;\n    left = Math.max(8, Math.min(left, window.scrollX + document.documentElement.clientWidth - selToolbar.offsetWidth - 8));\n    selToolbar.style.top = top + 'px';\n    selToolbar.style.left = left + 'px';\n}\n\nfunction hideSelectionToolbar() { selToolbar.style.display = 'none'; }\n\nfunction mergeAdjacentHighlights(root) {\n    root.querySelectorAll('span.highlight').forEach(span => {\n        let next = span.nextSibling;\n        while (next && next.nodeType === 1 && next.classList && next.classList.contains('highlight')) {\n            while (next.firstChild) span.appendChild(next.firstChild);\n            const toRemove = next; next = next.nextSibling; toRemove.remove();\n        }\n        span.normalize();\n    });\n}\n\nfunction applyHighlight() {\n    const range = currentSelectionRange;\n    if (!range || range.collapsed) { hideSelectionToolbar(); return; }\n    try {\n        if (range.startContainer === range.endContainer && range.startContainer.nodeType === Node.TEXT_NODE) {\n            const span = document.createElement('span'); span.className = 'highlight';\n            range.surroundContents(span);\n        } else {\n            const frag = range.extractContents();\n            const span = document.createElement('span'); span.className = 'highlight';\n            span.appendChild(frag); range.insertNode(span);\n        }\n    } catch (err) { console.warn('Highlight failed:', err); }\n    mergeAdjacentHighlights(document.body);\n    const sel = window.getSelection(); if (sel) sel.removeAllRanges();\n    currentSelectionRange = null; hideSelectionToolbar();\n}\n\nfunction addComment() {\n    const range = currentSelectionRange;\n    if (!range || range.collapsed) { hideSelectionToolbar(); return; }\n    const commentText = prompt('Enter your note:');\n    if (!commentText) { hideSelectionToolbar(); return; }\n    try {\n        const span = document.createElement('span'); span.className = 'comment-highlight';\n        const tooltip = document.createElement('span'); tooltip.className = 'comment-tooltip'; tooltip.textContent = commentText;\n        const frag = range.extractContents();\n        span.appendChild(frag); span.appendChild(tooltip); range.insertNode(span);\n    } catch (err) { console.warn('Comment failed:', err); }\n    const sel = window.getSelection(); if (sel) sel.removeAllRanges();\n    currentSelectionRange = null; hideSelectionToolbar();\n}\n\nfunction clearSelectionHighlight() {\n    const range = currentSelectionRange;\n    if (!range) { hideSelectionToolbar(); return; }\n    document.querySelectorAll('.highlight, .comment-highlight').forEach(el => {\n        let intersects = false;\n        try { intersects = range.intersectsNode(el); } catch (e) { intersects = false; }\n        if (intersects) {\n            const parent = el.parentNode;\n            while (el.firstChild) {\n                if (el.firstChild.nodeType === 1 && el.firstChild.classList.contains('comment-tooltip')) el.removeChild(el.firstChild);\n                else parent.insertBefore(el.firstChild, el);\n            }\n            parent.removeChild(el); parent.normalize();\n        }\n    });\n    const sel = window.getSelection(); if (sel) sel.removeAllRanges();\n    currentSelectionRange = null; hideSelectionToolbar();\n}\n\nfunction clearAllHighlights() {\n    document.querySelectorAll('.highlight, .comment-highlight').forEach(el => {\n        const parent = el.parentNode;\n        while (el.firstChild) {\n            if (el.firstChild.nodeType === 1 && el.firstChild.classList.contains('comment-tooltip')) el.removeChild(el.firstChild);\n            else parent.insertBefore(el.firstChild, el);\n        }\n        parent.removeChild(el); parent.normalize();\n    });\n}\n\n/* ===== Check answers ===== */\nfunction checkAnswers() {\n    let score = 0;\n    const resultsData = [];\n\n    document.querySelectorAll('.multi-choice-option.correct, .multi-choice-option.incorrect, .matching-select.correct, .matching-select.incorrect, .subQuestion.correct, .subQuestion.incorrect')\n        .forEach(el => el.classList.remove('correct', 'incorrect'));\n\n    Object.keys(correctAnswers).forEach(key => {\n        const correctAnswer = correctAnswers[key];\n        const type = questionTypes[key];\n        const qNum = parseInt(key.replace('q', ''), 10);\n        const btn = document.querySelector(`.subQuestion[data-q=\"${qNum}\"]`);\n        let userAnswer = '';\n        let isCorrect = false;\n\n        if (type === 'select') {\n            const el = document.getElementById(key);\n            userAnswer = el ? el.value.trim() : '';\n            isCorrect = userAnswer.toUpperCase() === correctAnswer.toUpperCase();\n            if (el) el.classList.add(isCorrect ? 'correct' : 'incorrect');\n        } else if (type === 'mcq') {\n            const checked = document.querySelector(`input[name=\"${key}\"]:checked`);\n            userAnswer = checked ? checked.value : 'No Answer';\n            isCorrect = userAnswer === correctAnswer;\n            document.querySelectorAll(`input[name=\"${key}\"]`).forEach(radio => {\n                const wrapper = radio.closest('.multi-choice-option');\n                if (!wrapper) return;\n                if (radio.value === correctAnswer) wrapper.classList.add('correct');\n                else if (radio.checked) wrapper.classList.add('incorrect');\n            });\n        }\n\n        if (btn) { btn.classList.remove('answered'); btn.classList.add(isCorrect ? 'correct' : 'incorrect'); }\n        if (isCorrect) score++;\n\n        resultsData.push({\n            question: qNum,\n            userAnswer: userAnswer || 'No Answer',\n            correctAnswer: String(correctAnswer),\n            isCorrect: isCorrect\n        });\n    });\n\n    document.querySelectorAll('.multi-choice-option input[type=\"radio\"], .matching-select').forEach(i => i.disabled = true);\n\n    document.querySelector('.main-container').classList.add('results-mode');\n    loadTranscription();\n\n    const scoreSummary = document.getElementById('score-summary');\n    const resultDetails = document.getElementById('result-details');\n    scoreSummary.textContent = `You scored ${score} out of 10.`;\n\n    let tableHTML = '<table><thead><tr><th>Question<\/th><th>Your Answer<\/th><th>Correct Answer<\/th><th>Result<\/th><\/tr><\/thead><tbody>';\n    resultsData.sort((a, b) => a.question - b.question).forEach(res => {\n        tableHTML += `<tr>\n            <td>${res.question}<\/td>\n            <td>${res.userAnswer}<\/td>\n            <td>${res.correctAnswer}<\/td>\n            <td class=\"${res.isCorrect ? 'result-correct' : 'result-incorrect'}\">${res.isCorrect ? '&#10004; Correct' : '&#10008; Incorrect'}<\/td>\n        <\/tr>`;\n    });\n    tableHTML += '<\/tbody><\/table>';\n    resultDetails.innerHTML = tableHTML;\n\n    const deliverButton = document.getElementById('deliver-button');\n    deliverButton.classList.add('success');\n    deliverButton.innerHTML = '<span>My Results<\/span>';\n    const myResultsBtn = deliverButton.cloneNode(true);\n    deliverButton.parentNode.replaceChild(myResultsBtn, deliverButton);\n    myResultsBtn.addEventListener('click', () => { document.getElementById('result-modal').style.display = 'flex'; });\n\n    document.getElementById('result-modal').style.display = 'flex';\n}\n\n/* ===================================================================\n   AUDIO PLAYER\n   =================================================================== */\n(function () {\n    'use strict';\n\n    const audio = document.getElementById('global-audio-player');\n    const playBtn = document.getElementById('play-pause-btn');\n    const progress = document.getElementById('progress-bar');\n    const currentLabel = document.getElementById('current-time');\n    const totalLabel = document.getElementById('total-duration');\n    const volumeSlider = document.getElementById('new-volume-slider');\n    const volumeBtn = document.getElementById('volume-btn');\n    const speedBtn = document.getElementById('speed-btn');\n    const speedOptions = document.getElementById('speed-options');\n\n    let isDragging = false;\n\n    function formatTime(seconds) {\n        if (isNaN(seconds)) return '0:00';\n        const m = Math.floor(seconds / 60);\n        const s = Math.floor(seconds % 60);\n        return m + ':' + (s < 10 ? '0' : '') + s;\n    }\n\n    function togglePlay() {\n        if (audio.paused) { audio.play().catch(() => {}); }\n        else { audio.pause(); }\n    }\n\n    function updatePlayIcon() {\n        playBtn.innerHTML = audio.paused\n            ? '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg>'\n            : '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M6 19h4V5H6v14zm8-14v14h4V5h-4z\"/><\/svg>';\n    }\n\n    function updateVolumeIcon(val) {\n        const v = val !== undefined ? val : audio.volume;\n        const icon = volumeBtn.querySelector('svg');\n        if (v === 0) {\n            icon.innerHTML = '<polygon points=\"11 5 6 9 2 9 2 15 6 15 11 19 11 5\"><\/polygon><line x1=\"23\" y1=\"9\" x2=\"17\" y2=\"15\"><\/line><line x1=\"17\" y1=\"9\" x2=\"23\" y2=\"15\"><\/line>';\n        } else if (v < 0.5) {\n            icon.innerHTML = '<polygon points=\"11 5 6 9 2 9 2 15 6 15 11 19 11 5\"><\/polygon><path d=\"M15.54 8.46a5 5 0 0 1 0 7.07\"><\/path>';\n        } else {\n            icon.innerHTML = '<polygon points=\"11 5 6 9 2 9 2 15 6 15 11 19 11 5\"><\/polygon><path d=\"M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07\"><\/path>';\n        }\n    }\n\n    function setVolume(val) {\n        const v = Math.min(1, Math.max(0, parseFloat(val)));\n        audio.volume = v;\n        volumeSlider.value = v;\n        updateVolumeIcon(v);\n    }\n\n    function toggleMute() {\n        if (audio.volume > 0) {\n            audio.dataset.prevVolume = audio.volume;\n            setVolume(0);\n        } else {\n            setVolume(parseFloat(audio.dataset.prevVolume) || 0.8);\n        }\n    }\n\n    function setSpeed(val) {\n        const speed = parseFloat(val);\n        if (isNaN(speed)) return;\n        audio.playbackRate = speed;\n        speedBtn.textContent = speed + 'x';\n        speedOptions.querySelectorAll('div').forEach(el => {\n            el.classList.toggle('active', parseFloat(el.dataset.speed) === speed);\n        });\n        speedOptions.classList.add('hidden');\n    }\n\n    playBtn.addEventListener('click', togglePlay);\n    audio.addEventListener('play', updatePlayIcon);\n    audio.addEventListener('pause', updatePlayIcon);\n    audio.addEventListener('ended', () => {\n        updatePlayIcon();\n        progress.value = 0;\n        currentLabel.textContent = formatTime(0);\n    });\n\n    audio.addEventListener('loadedmetadata', () => {\n        progress.max = audio.duration;\n        totalLabel.textContent = formatTime(audio.duration);\n        currentLabel.textContent = formatTime(audio.currentTime);\n    });\n    audio.addEventListener('timeupdate', () => {\n        if (isDragging) return;\n        progress.value = audio.currentTime;\n        currentLabel.textContent = formatTime(audio.currentTime);\n    });\n\n    progress.addEventListener('mousedown', () => { isDragging = true; });\n    progress.addEventListener('mouseup', () => { isDragging = false; });\n    progress.addEventListener('touchstart', () => { isDragging = true; });\n    progress.addEventListener('touchend', () => { isDragging = false; });\n    progress.addEventListener('input', () => {\n        audio.currentTime = progress.value;\n        currentLabel.textContent = formatTime(progress.value);\n    });\n\n    volumeSlider.addEventListener('input', (e) => {\n        const v = parseFloat(e.target.value);\n        audio.volume = v;\n        updateVolumeIcon(v);\n    });\n    volumeBtn.addEventListener('click', toggleMute);\n\n    speedBtn.addEventListener('click', (e) => {\n        e.stopPropagation();\n        speedOptions.classList.toggle('hidden');\n    });\n    speedOptions.addEventListener('click', (e) => {\n        if (e.target.dataset.speed) setSpeed(e.target.dataset.speed);\n    });\n    document.addEventListener('click', () => speedOptions.classList.add('hidden'));\n\n    /* Spacebar play/pause when not typing in a field */\n    document.addEventListener('keydown', (e) => {\n        if (e.code !== 'Space') return;\n        const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';\n        if (tag === 'input' || tag === 'textarea' || tag === 'select' || tag === 'button') return;\n        e.preventDefault();\n        togglePlay();\n    });\n\n    setVolume(1);\n    updatePlayIcon();\n\n    audio.addEventListener('error', () => {\n        console.warn('Audio failed to load. Check the source URL.');\n        totalLabel.textContent = '-:--';\n    });\n})();\n\n/* ===== Init ===== */\ndocument.addEventListener('DOMContentLoaded', function () {\n    populateSelects();\n    buildSubQuestions();\n    initDarkMode();\n    initFontSize();\n    goToQuestion(MIN_Q);\n\n    darkModeToggle.addEventListener('click', toggleDarkMode);\n    document.getElementById('clear-all-btn').addEventListener('click', clearAllHighlights);\n\n    fontSizeToggle.addEventListener('click', () => fontSizeOptions.classList.toggle('show'));\n    document.addEventListener('click', (e) => { ons\" class=\"font-size-options\">\n                    <div data-size=\"small\">Small<\/div>\n                    <div data-size=\"medium\">Medium<\/div>\n                    <div data-size=\"large\">Large<\/div>\n                    <div data-size=\"xlarge\">Extra Large<\/div>\n                <\/div>\n            <\/div>\n            <button class=\"dark-mode-btn\" id=\"dark-mode-toggle\" title=\"Toggle Dark Mode\">\n                <svg class=\"sun-icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n                <svg class=\"moon-icon\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n            <\/button>\n        <\/div>\n    <\/div>\n\n    <!-- ================= AUDIO PLAYER ================= -->\n    <div class=\"audio-player-container\">\n        <button id=\"play-pause-btn\" class=\"player-btn\" aria-label=\"Play / Pause\">\n            <svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg>\n        <\/button>\n        <div class=\"progress-container\">\n            <span id=\"current-time\">0:00<\/span>\n            <input type=\"range\" id=\"progress-bar\" value=\"0\" step=\"1\" min=\"0\" max=\"100\" aria-label=\"Seek\">\n            <span id=\"total-duration\">0:00<\/span>\n        <\/div>\n        <div class=\"controls-container\">\n            <div style=\"display:flex;align-items:center;\">\n                <button id=\"volume-btn\" class=\"player-btn\" aria-label=\"Toggle mute\">\n                    <svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\">\n                        <polygon points=\"11 5 6 9 2 9 2 15 6 15 11 19 11 5\"><\/polygon>\n                        <path d=\"M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07\"><\/path>\n                    <\/svg>\n                <\/button>\n                <input type=\"range\" id=\"new-volume-slider\" min=\"0\" max=\"1\" step=\"0.01\" value=\"1\" aria-label=\"Volume\">\n            <\/div>\n            <div class=\"speed-container\">\n                <button id=\"speed-btn\" class=\"player-btn\">1x<\/button>\n                <div id=\"speed-options\" class=\"hidden\">\n                    <div data-speed=\"0.5\">0.5x<\/div>\n                    <div data-speed=\"0.75\">0.75x<\/div>\n                    <div data-speed=\"1\" class=\"active\">1x<\/div>\n                    <div data-speed=\"1.25\">1.25x<\/div>\n                    <div data-speed=\"1.5\">1.5x<\/div>\n                    <div data-speed=\"2\">2x<\/div>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <audio id=\"global-audio-player\" preload=\"metadata\"\n           src=\"https://ia600804.us.archive.org/26/items/0803_20260803/0803.MP3\"><\/audio>\n\n    <div class=\"main-container\">\n        <div class=\"left-panel\">\n            <div id=\"part-4\" class=\"question-part\">\n                <div class=\"part-header\">\n                    <p><strong>Part 4<\/strong><\/p>\n                    <p>Listen and answer questions 31-40.<\/p>\n                <\/div>\n                <div class=\"questions-container\">\n                    <div class=\"question\">\n                        <div class=\"question-prompt\">\n                            <p><strong>Questions 31\u201340<\/strong><\/p>\n                            <p>Complete the notes below.<\/p>\n                            <p>Write <strong>ONE WORD ONLY<\/strong> for each answer.<\/p>\n                        <\/div>\n                        <p class=\"centered-title\"><strong>Providing IT support for University Teachers<\/strong><\/p>\n\n                        <p><strong>Problems<\/strong><\/p>\n                        <ul style=\"list-style-type: none; padding-left: 0;\">\n                            <li>In the past, some people believed that the use of <strong>31<\/strong> <input type=\"text\" id=\"q31\" class=\"answer-input\" placeholder=\"31\" autocomplete=\"off\"> failed to help students interact with teachers.<\/li>\n                        <\/ul>\n\n                        <p><strong>Qualities to look for in mentors<\/strong><\/p>\n                        <ul style=\"list-style-type: none; padding-left: 0;\">\n                            <li>Students enjoy the <strong>32<\/strong> <input type=\"text\" id=\"q32\" class=\"answer-input\" placeholder=\"32\" autocomplete=\"off\"> with teachers.<\/li>\n                        <\/ul>\n\n                        <p><strong>Advantages:<\/strong><\/p>\n                        <ul style=\"list-style-type: none; padding-left: 0;\">\n                            <li>IT in education develops a tight <strong>33<\/strong> <input type=\"text\" id=\"q33\" class=\"answer-input\" placeholder=\"33\" autocomplete=\"off\"> with the local economy.<\/li>\n                        <\/ul>\n\n                        <p><strong>For teachers:<\/strong><\/p>\n                        <ul style=\"list-style-type: none; padding-left: 0;\">\n                            <li>Computers are commonly used to develop teaching <strong>34<\/strong> <input type=\"text\" id=\"q34\" class=\"answer-input\" placeholder=\"34\" autocomplete=\"off\"><\/li>\n                            <li>New technology builds up greater <strong>35<\/strong> <input type=\"text\" id=\"q35\" class=\"answer-input\" placeholder=\"35\" autocomplete=\"off\"> for students.<\/li>\n                            <li>Compared with traditional teaching, the new way is more <strong>36<\/strong> <input type=\"text\" id=\"q36\" class=\"answer-input\" placeholder=\"36\" autocomplete=\"off\"><\/li>\n                            <li>It offers students quality <strong>37<\/strong> <input type=\"text\" id=\"q37\" class=\"answer-input\" placeholder=\"37\" autocomplete=\"off\"><\/li>\n                        <\/ul>\n\n                        <p><strong>For students:<\/strong><\/p>\n                        <ul style=\"list-style-type: none; padding-left: 0;\">\n                            <li>It is seen as a new solution to new <strong>38<\/strong> <input type=\"text\" id=\"q38\" class=\"answer-input\" placeholder=\"38\" autocomplete=\"off\"><\/li>\n                            <li>It nurtures <strong>39<\/strong> <input type=\"text\" id=\"q39\" class=\"answer-input\" placeholder=\"39\" autocomplete=\"off\"> management skills.<\/li>\n                            <li>It also provides students a source of <strong>40<\/strong> <input type=\"text\" id=\"q40\" class=\"answer-input\" placeholder=\"40\" autocomplete=\"off\"><\/li>\n                        <\/ul>\n                    <\/div>\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <div class=\"right-panel\" id=\"transcription-panel\">\n            <h2>Transcription<\/h2>\n            <div id=\"transcription-text\"><\/div>\n        <\/div>\n    <\/div>\n\n    <!-- Hidden transcription data -->\n    <div id=\"transcription-data\" style=\"display:none;\">\n        <div data-part=\"4\">\n            <strong>SECTION 4<\/strong><br><br>\n            Questions 31-40<br><br>\n            Hello and welcome to today's seminar about education. Education is a lifelong process. There is no limit on when to start and stop, and we have been using technology so much these days in each and every sector of our lives, including education. Have we ever taken out a second to wonder if it's leaving a positive impact on our work, or it's just that we have been relying on it so much that we've become used to it. Yes, there used to be some problems here. Earlier, there was a lot of debate about technology and education amongst the faculty at our school. Everyone had their own views. At first, some believed that the use of <span class=\"highlight\">email<\/span> made students and teachers interact with each other rather less, and this was not a good thing. In terms of characteristics to consider when seeking mentors, this practice involves a kind of software which allows students, as well as teachers, to talk and discuss with each other more easily, and they said they enjoy this way of <span class=\"highlight\">communication<\/span>. But gradually, as technology was embraced by more educational institutes, they realised the importance of technology in education. The main benefit is that there is a strong <span class=\"highlight\">relationship<\/span> with the local economy when it comes to the effectiveness of the use of IT in education. In the more developed areas, the schools and institutions have better access to more advanced technology, and the teachers are better trained to use the technology to improve the quality of their classes. In contrast, in some less developed regions and remote areas where technology is not so common, the effectiveness can't be guaranteed. However, wherever they are, the most common example for teachers using technology in education is the usage of computers in their <span class=\"highlight\">methods<\/span> of incorporating computers into teaching. In most classrooms, the mode offers students a channel to post any work that they are proud of, whether it's a nice photograph that they take, a case study they do, a song they record, or even just a great idea they have, so it gives them a chance to showcase their strength and build up their <span class=\"highlight\">confidence<\/span>. Many students use this feature to show the best of themselves. It also provides students an opportunity to choose what they learn on the Internet, so they no longer have to sit in the classroom listening to something they aren't bored with and they don't have to wait all night trying to register for their favorite elective courses. Compared with the traditional platform, it is more <span class=\"highlight\">flexible<\/span>. The open source which the new mode provides is free for students to use when they are trying to look up online for their papers or researchers and the data will not easily be found on the Internet because only registered users have access to the database. By the way, all the materials are original works of teachers or scholars, so there is no need to worry about the quality of the <span class=\"highlight\">content<\/span>, and with the overwhelming amount of unwanted information on the Internet, this mode gives students a new search engine they can use on campus, so information like advertisements and sceptical sources will be filtered easily. This is a perfect example that can offer some hope of reducing <span class=\"highlight\">problems<\/span>. Apart from that, students can arrange their daily activities and improve their <span class=\"highlight\">time<\/span> management skills by simply ticking the boxes in the timetable online. They can set up their own starting time and their deadline for each assignment. The system also gives them a reliable source of <span class=\"highlight\">information<\/span>.\n        <\/div>\n    <\/div>\n\n    <div class=\"nav-arrows\">\n        <button class=\"nav-arrow\" onclick=\"previousQuestion()\" id=\"prevBtn\">\u2039<\/button>\n        <button class=\"nav-arrow\" onclick=\"nextQuestion()\" id=\"nextBtn\">\u203a<\/button>\n    <\/div>\n\n    <nav class=\"nav-row\" aria-label=\"Questions\">\n        <div class=\"footer__questionWrapper__1tZ46 multiple\">\n            <button class=\"footer__questionNo__3WNct\" onclick=\"goToQuestion(31)\">\n                <span>Part 4 <span style=\"font-size:14px;\" id=\"answered-count\">0 of 10<\/span><\/span>\n            <\/button>\n            <div class=\"footer__subquestionWrapper__9GgoP\">\n                <button class=\"subQuestion\" onclick=\"goToQuestion(31)\">31<\/button>\n                <button class=\"subQuestion\" onclick=\"goToQuestion(32)\">32<\/button>\n                <button class=\"subQuestion\" onclick=\"goToQuestion(33)\">33<\/button>\n                <button class=\"subQuestion\" onclick=\"goToQuestion(34)\">34<\/button>\n                <button class=\"subQuestion\" onclick=\"goToQuestion(35)\">35<\/button>\n                <button class=\"subQuestion\" onclick=\"goToQuestion(36)\">36<\/button>\n                <button class=\"subQuestion\" onclick=\"goToQuestion(37)\">37<\/button>\n                <button class=\"subQuestion\" onclick=\"goToQuestion(38)\">38<\/button>\n                <button class=\"subQuestion\" onclick=\"goToQuestion(39)\">39<\/button>\n                <button class=\"subQuestion\" onclick=\"goToQuestion(40)\">40<\/button>\n            <\/div>\n        <\/div>\n        <button id=\"deliver-button\" class=\"footer__deliverButton__3FM07\">Check Answers<\/button>\n    <\/nav>\n\n    <div id=\"contextMenu\" class=\"context-menu\">\n        <div class=\"context-menu-item\" onclick=\"highlightText()\">Highlight<\/div>\n        <div class=\"context-menu-item\" onclick=\"clearAllHighlights()\">Clear All<\/div>\n    <\/div>\n\n    <div id=\"selection-toolbar\">\n        <button onclick=\"applyHighlight()\">Highlight<\/button>\n        <button class=\"secondary\" onclick=\"addComment()\">Note<\/button>\n        <button class=\"secondary\" onclick=\"clearSelectionHighlight()\">Clear<\/button>\n    <\/div>\n\n    <div id=\"result-modal\" class=\"modal-overlay\" style=\"display: none;\">\n        <div class=\"modal-content\">\n            <div class=\"modal-header\">\n                <h2>Your Results<\/h2>\n                <button id=\"modal-close-button\" class=\"modal-close-btn\">&times;<\/button>\n            <\/div>\n            <p id=\"score-summary\"><\/p>\n            <div id=\"result-details\"><\/div>\n        <\/div>\n    <\/div>\n\n    <script>\n        let currentQuestion = 31;\n        let selectedRange = null;\n\n        const body = document.body;\n        const darkModeToggle = document.getElementById('dark-mode-toggle');\n        const fontSizeToggle = document.getElementById('font-size-toggle');\n        const fontSizeOptions = document.getElementById('font-size-options');\n\n        // Answer key for Part 4\n        const correctAnswers = {\n            q31: 'email',\n            q32: 'communication',\n            q33: 'relationship',\n            q34: 'methods',\n            q35: 'confidence',\n            q36: 'flexible',\n            q37: 'content',\n            q38: 'problems',\n            q39: 'time',\n            q40: 'information'\n        };\n\n        function initDarkMode() {\n            const saved = localStorage.getItem('theme') || 'light';\n            body.setAttribute('data-theme', saved);\n        }\n        function toggleDarkMode() {\n            const isDark = body.getAttribute('data-theme') === 'dark';\n            body.setAttribute('data-theme', isDark ? 'light' : 'dark');\n            localStorage.setItem('theme', isDark ? 'light' : 'dark');\n        }\n        function changeFontSize(size) {\n            body.classList.remove('font-small', 'font-medium', 'font-large', 'font-xlarge');\n            body.classList.add(`font-${size}`);\n            localStorage.setItem('fontSize', size);\n            fontSizeOptions.classList.remove('show');\n        }\n        function initFontSize() {\n            const saved = localStorage.getItem('fontSize') || 'medium';\n            changeFontSize(saved);\n        }\n\n        function goToQuestion(qNum) {\n            if (qNum < 31 || qNum > 40) return;\n            currentQuestion = qNum;\n            document.querySelectorAll('.subQuestion').forEach(b => b.classList.remove('active'));\n            const btn = document.querySelector(`.subQuestion[onclick=\"goToQuestion(${qNum})\"]`);\n            if (btn) btn.classList.add('active');\n            document.getElementById('prevBtn').disabled = currentQuestion === 31;\n            document.getElementById('nextBtn').disabled = currentQuestion === 40;\n\n            const inputEl = document.getElementById(`q${qNum}`);\n            if (inputEl) {\n                const container = inputEl.closest('.question') || inputEl.closest('ul');\n                if (container) {\n                    container.scrollIntoView({ behavior: 'smooth', block: 'center' });\n                    container.classList.add('flash');\n                    setTimeout(() => container.classList.remove('flash'), 1000);\n                }\n            }\n        }\n\n        function nextQuestion() { if (currentQuestion < 40) goToQuestion(currentQuestion + 1); }\n        function previousQuestion() { if (currentQuestion > 31) goToQuestion(currentQuestion - 1); }\n\n        function updateAnsweredIndicators() {\n            for (let q = 31; q <= 40; q++) {\n                const btn = document.querySelector(`.subQuestion[onclick=\"goToQuestion(${q})\"]`);\n                if (!btn) continue;\n                if (btn.classList.contains('correct') || btn.classList.contains('incorrect')) continue;\n                const input = document.getElementById(`q${q}`);\n                const answered = input && input.value.trim() !== '';\n                btn.classList.toggle('answered', answered);\n            }\n            const count = document.querySelectorAll('.subQuestion.answered, .subQuestion.correct, .subQuestion.incorrect').length;\n            document.getElementById('answered-count').textContent = `${count} of 10`;\n        }\n\n        function checkAnswers() {\n            let score = 0;\n            let resultsData = [];\n            document.querySelectorAll('.correct, .incorrect, .correct-inline').forEach(el => {\n                if (el.classList.contains('correct-inline')) el.remove();\n                else el.classList.remove('correct', 'incorrect');\n            });\n\n            for (let q = 31; q <= 40; q++) {\n                const key = `q${q}`;\n                const correct = correctAnswers[key].toLowerCase();\n                const input = document.getElementById(key);\n                let userAnswer = '';\n                let isCorrect = false;\n\n                if (input) {\n                    userAnswer = input.value.trim();\n                    isCorrect = userAnswer.toLowerCase() === correct;\n                    input.classList.add(isCorrect ? 'correct' : 'incorrect');\n                    if (!isCorrect) {\n                        const span = document.createElement('span');\n                        span.className = 'correct-inline';\n                        span.textContent = correctAnswers[key];\n                        input.insertAdjacentElement('afterend', span);\n                    }\n                }\n\n                const btn = document.querySelector(`.subQuestion[onclick=\"goToQuestion(${q})\"]`);\n                if (btn) {\n                    btn.classList.remove('answered');\n                    btn.classList.add(isCorrect ? 'correct' : 'incorrect');\n                }\n                resultsData.push({\n                    question: q,\n                    userAnswer: userAnswer || 'No Answer',\n                    correctAnswer: correctAnswers[key],\n                    isCorrect\n                });\n                if (isCorrect) score++;\n            }\n\n            document.querySelectorAll('.answer-input').forEach(input => input.disabled = true);\n\n            // Show transcription panel in results mode\n            document.querySelector('.main-container').classList.add('results-mode');\n            const transcriptionSource = document.querySelector('#transcription-data [data-part=\"4\"]');\n            document.getElementById('transcription-text').innerHTML = transcriptionSource ? transcriptionSource.innerHTML : '';\n\n            const modal = document.getElementById('result-modal');\n            document.getElementById('score-summary').textContent = `You scored ${score} out of 10`;\n            let tableHTML = `<table style=\"width:100%; border-collapse:collapse;\"><tr><th>Q<\/th><th>Your Answer<\/th><th>Correct<\/th><th>Result<\/th><\/tr>`;\n            resultsData.forEach(r => {\n                tableHTML += `<tr>\n                    <td>${r.question}<\/td>\n                    <td>${r.userAnswer}<\/td>\n                    <td>${r.correctAnswer}<\/td>\n                    <td style=\"color:${r.isCorrect ? 'green' : 'red'}\">${r.isCorrect ? '\u2714' : '\u2716'}<\/td>\n                <\/tr>`;\n            });\n            tableHTML += '<\/table>';\n            document.getElementById('result-details').innerHTML = tableHTML;\n            modal.style.display = 'flex';\n\n            const deliverBtn = document.getElementById('deliver-button');\n            deliverBtn.classList.add('success');\n            deliverBtn.innerHTML = '<span>My Results<\/span>';\n            deliverBtn.disabled = false;\n            deliverBtn.onclick = () => { modal.style.display = 'flex'; };\n        }\n\n        // --- Highlighting functionality ---\n        const selToolbar = document.getElementById('selection-toolbar');\n        let currentSelectionRange = null;\n\n        function saveSelection() {\n            const sel = window.getSelection();\n            if (sel && sel.rangeCount > 0 && !sel.isCollapsed && sel.toString().trim() !== '') {\n                currentSelectionRange = sel.getRangeAt(0).cloneRange();\n                selectedRange = currentSelectionRange;\n                return true;\n            }\n            return false;\n        }\n\n        function showSelectionToolbar() {\n            const sel = window.getSelection();\n            if (!sel || sel.rangeCount === 0 || sel.isCollapsed || sel.toString().trim() === '') { hideSelectionToolbar(); return; }\n            const range = sel.getRangeAt(0);\n            const rect = range.getBoundingClientRect();\n            if (rect.width === 0 && rect.height === 0) { hideSelectionToolbar(); return; }\n            currentSelectionRange = range.cloneRange();\n            selToolbar.style.display = 'flex';\n            let top = window.scrollY + rect.top - selToolbar.offsetHeight - 8;\n            let left = window.scrollX + rect.left + rect.width / 2 - selToolbar.offsetWidth / 2;\n            if (top < window.scrollY + 5) top = window.scrollY + rect.bottom + 8;\n            left = Math.max(8, Math.min(left, window.scrollX + document.documentElement.clientWidth - selToolbar.offsetWidth - 8));\n            selToolbar.style.top = top + 'px';\n            selToolbar.style.left = left + 'px';\n        }\n\n        function hideSelectionToolbar() { selToolbar.style.display = 'none'; }\n\n        function mergeAdjacentHighlights(root) {\n            root.querySelectorAll('span.highlight').forEach(span => {\n                let next = span.nextSibling;\n                while (next && next.nodeType === 1 && next.classList && next.classList.contains('highlight')) {\n                    while (next.firstChild) span.appendChild(next.firstChild);\n                    const toRemove = next; next = next.nextSibling; toRemove.remove();\n                }\n                span.normalize();\n            });\n        }\n\n        function applyHighlight() {\n            const range = currentSelectionRange;\n            if (!range || range.collapsed) { hideSelectionToolbar(); return; }\n            try {\n                if (range.startContainer === range.endContainer && range.startContainer.nodeType === Node.TEXT_NODE) {\n                    const span = document.createElement('span'); span.className = 'highlight';\n                    range.surroundContents(span);\n                } else {\n                    const frag = range.extractContents();\n                    const span = document.createElement('span'); span.className = 'highlight';\n                    span.appendChild(frag); range.insertNode(span);\n                }\n            } catch (err) { console.warn('Highlight failed:', err); }\n            mergeAdjacentHighlights(document.body);\n            const sel = window.getSelection(); if (sel) sel.removeAllRanges();\n            currentSelectionRange = null; hideSelectionToolbar();\n        }\n\n        function addComment() {\n            const range = currentSelectionRange;\n            if (!range || range.collapsed) { hideSelectionToolbar(); return; }\n            const commentText = prompt('Enter your note:');\n            if (!commentText) { hideSelectionToolbar(); return; }\n            try {\n                const span = document.createElement('span'); span.className = 'comment-highlight';\n                const tooltip = document.createElement('span'); tooltip.className = 'comment-tooltip'; tooltip.textContent = commentText;\n                const frag = range.extractContents();\n                span.appendChild(frag); span.appendChild(tooltip); range.insertNode(span);\n            } catch (err) { console.warn('Comment failed:', err); }\n            const sel = window.getSelection(); if (sel) sel.removeAllRanges();\n            currentSelectionRange = null; hideSelectionToolbar();\n        }\n\n        function clearSelectionHighlight() {\n            const range = currentSelectionRange;\n            if (!range) { hideSelectionToolbar(); return; }\n            document.querySelectorAll('.highlight, .comment-highlight').forEach(el => {\n                let intersects = false;\n                try { intersects = range.intersectsNode(el); } catch (e) { intersects = false; }\n                if (intersects) {\n                    const parent = el.parentNode;\n                    while (el.firstChild) {\n                        if (el.firstChild.nodeType === 1 && el.firstChild.classList.contains('comment-tooltip')) el.removeChild(el.firstChild);\n                        else parent.insertBefore(el.firstChild, el);\n                    }\n                    parent.removeChild(el); parent.normalize();\n                }\n            });\n            const sel = window.getSelection(); if (sel) sel.removeAllRanges();\n            currentSelectionRange = null; hideSelectionToolbar();\n        }\n\n        // Legacy right-click menu handler (kept for context menu)\n        function highlightText() {\n            saveSelection();\n            applyHighlight();\n            closeContextMenu();\n        }\n\n        function clearAllHighlights() {\n            document.querySelectorAll('.highlight, .comment-highlight').forEach(el => {\n                const parent = el.parentNode;\n                while (el.firstChild) {\n                    if (el.firstChild.nodeType === 1 && el.firstChild.classList.contains('comment-tooltip')) el.removeChild(el.firstChild);\n                    else parent.insertBefore(el.firstChild, el);\n                }\n                parent.removeChild(el); parent.normalize();\n            });\n            closeContextMenu();\n        }\n\n        function closeContextMenu() { document.getElementById('contextMenu').style.display = 'none'; }\n\n        document.addEventListener('DOMContentLoaded', () => {\n            initDarkMode();\n            initFontSize();\n            goToQuestion(31);\n\n            darkModeToggle.addEventListener('click', toggleDarkMode);\n            fontSizeToggle.addEventListener('click', () => fontSizeOptions.classList.toggle('show'));\n            document.addEventListener('click', (e) => {\n                if (!e.target.closest('.font-size-container')) fontSizeOptions.classList.remove('show');\n            });\n            document.querySelectorAll('.font-size-options div').forEach(opt => {\n                opt.addEventListener('click', () => changeFontSize(opt.dataset.size));\n            });\n            document.getElementById('deliver-button').addEventListener('click', checkAnswers);\n            document.getElementById('modal-close-button').addEventListener('click', () => {\n                document.getElementById('result-modal').style.display = 'none';\n            });\n\n            document.querySelectorAll('.answer-input').forEach(input => {\n                input.addEventListener('input', updateAnsweredIndicators);\n            });\n\n            document.getElementById('clear-all-btn').addEventListener('click', clearAllHighlights);\n\n            document.addEventListener('mouseup', (e) => {\n                if (e.target.closest('.audio-player-container')) return;\n                if (e.target.closest('#selection-toolbar')) return;\n                setTimeout(showSelectionToolbar, 0);\n            });\n            document.addEventListener('touchend', (e) => {\n                if (e.target.closest('.audio-player-container')) return;\n                if (e.target.closest('#selection-toolbar')) return;\n                setTimeout(showSelectionToolbar, 0);\n            });\n            document.addEventListener('mousedown', (e) => { if (!e.target.closest('#selection-toolbar')) hideSelectionToolbar(); });\n            window.addEventListener('scroll', hideSelectionToolbar, true);\n\n            document.body.addEventListener('contextmenu', (e) => {\n                const selection = window.getSelection().toString();\n                if (!selection) return;\n                e.preventDefault();\n                const menu = document.getElementById('contextMenu');\n                menu.style.left = e.pageX + 'px';\n                menu.style.top = e.pageY + 'px';\n                menu.style.display = 'block';\n            });\n            document.body.addEventListener('click', (e) => {\n                if (!e.target.closest('.context-menu')) closeContextMenu();\n            });\n            document.addEventListener('selectionchange', () => { saveSelection(); });\n        });\n\n        /* ===================================================================\n           AUDIO PLAYER\n           =================================================================== */\n        (function () {\n            'use strict';\n            const audio = document.getElementById('global-audio-player');\n            const playBtn = document.getElementById('play-pause-btn');\n            const progress = document.getElementById('progress-bar');\n            const currentLabel = document.getElementById('current-time');\n            const totalLabel = document.getElementById('total-duration');\n            const volumeSlider = document.getElementById('new-volume-slider');\n            const volumeBtn = document.getElementById('volume-btn');\n            const speedBtn = document.getElementById('speed-btn');\n            const speedOptions = document.getElementById('speed-options');\n            let isDragging = false;\n\n            function formatTime(seconds) {\n                if (isNaN(seconds)) return '0:00';\n                const m = Math.floor(seconds / 60);\n                const s = Math.floor(seconds % 60);\n                return m + ':' + (s < 10 ? '0' : '') + s;\n            }\n            function togglePlay() {\n                if (audio.paused) { audio.play().catch(() => {}); } else { audio.pause(); }\n            }\n            function updatePlayIcon() {\n                playBtn.innerHTML = audio.paused\n                    ? '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg>'\n                    : '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M6 19h4V5H6v14zm8-14v14h4V5h-4z\"/><\/svg>';\n            }\n            function updateVolumeIcon(val) {\n                const v = val !== undefined ? val : audio.volume;\n                const icon = volumeBtn.querySelector('svg');\n                if (v === 0) {\n                    icon.innerHTML = '<polygon points=\"11 5 6 9 2 9 2 15 6 15 11 19 11 5\"><\/polygon><line x1=\"23\" y1=\"9\" x2=\"17\" y2=\"15\"><\/line><line x1=\"17\" y1=\"9\" x2=\"23\" y2=\"15\"><\/line>';\n                } else if (v < 0.5) {\n                    icon.innerHTML = '<polygon points=\"11 5 6 9 2 9 2 15 6 15 11 19 11 5\"><\/polygon><path d=\"M15.54 8.46a5 5 0 0 1 0 7.07\"><\/path>';\n                } else {\n                    icon.innerHTML = '<polygon points=\"11 5 6 9 2 9 2 15 6 15 11 19 11 5\"><\/polygon><path d=\"M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07\"><\/path>';\n                }\n            }\n            function setVolume(val) {\n                const v = Math.min(1, Math.max(0, parseFloat(val)));\n                audio.volume = v; volumeSlider.value = v; updateVolumeIcon(v);\n            }\n            function toggleMute() {\n                if (audio.volume > 0) { audio.dataset.prevVolume = audio.volume; setVolume(0); }\n                else { setVolume(parseFloat(audio.dataset.prevVolume) || 0.8); }\n            }\n            function setSpeed(val) {\n                const speed = parseFloat(val);\n                if (isNaN(speed)) return;\n                audio.playbackRate = speed;\n                speedBtn.textContent = speed + 'x';\n                speedOptions.querySelectorAll('div').forEach(el => el.classList.toggle('active', parseFloat(el.dataset.speed) === speed));\n                speedOptions.classList.add('hidden');\n            }\n\n            playBtn.addEventListener('click', togglePlay);\n            audio.addEventListener('play', updatePlayIcon);\n            audio.addEventListener('pause', updatePlayIcon);\n            audio.addEventListener('ended', () => { updatePlayIcon(); progress.value = 0; currentLabel.textContent = formatTime(0); });\n            audio.addEventListener('loadedmetadata', () => {\n                progress.max = audio.duration;\n                totalLabel.textContent = formatTime(audio.duration);\n                currentLabel.textContent = formatTime(audio.currentTime);\n            });\n            audio.addEventListener('timeupdate', () => {\n                if (isDragging) return;\n                progress.value = audio.currentTime;\n                currentLabel.textContent = formatTime(audio.currentTime);\n            });\n            progress.addEventListener('mousedown', () => { isDragging = true; });\n            progress.addEventListener('mouseup', () => { isDragging = false; });\n            progress.addEventListener('touchstart', () => { isDragging = true; });\n            progress.addEventListener('touchend', () => { isDragging = false; });\n            progress.addEventListener('input', () => {\n                audio.currentTime = progress.value;\n                currentLabel.textContent = formatTime(progress.value);\n            });\n            volumeSlider.addEventListener('input', (e) => {\n                const v = parseFloat(e.target.value);\n                audio.volume = v; updateVolumeIcon(v);\n            });\n            volumeBtn.addEventListener('click', toggleMute);\n            speedBtn.addEventListener('click', (e) => { e.stopPropagation(); speedOptions.classList.toggle('hidden'); });\n            speedOptions.addEventListener('click', (e) => { if (e.target.dataset.speed) setSpeed(e.target.dataset.speed); });\n            document.addEventListener('click', () => speedOptions.classList.add('hidden'));\n\n            document.addEventListener('keydown', (e) => {\n                if (e.code !== 'Space') return;\n                const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';\n                if (tag === 'input' || tag === 'textarea' || tag === 'select' || tag === 'button') return;\n                e.preventDefault();\n                togglePlay();\n            });\n\n            setVolume(1);\n            updatePlayIcon();\n            audio.addEventListener('error', () => {\n                console.warn('Audio failed to load. Check the source URL.');\n                totalLabel.textContent = '-:--';\n            });\n        })();\n    <\/script>\n<\/body>\n<\/html>";

const SOURCES = {
  part1: SRC_PART1,
  part2a: SRC_PART2A,
  part2b: SRC_PART2B,
  part4: SRC_PART4
};

const loaded = {};

function loadFrame(key) {
  if (loaded[key]) return;
  const frame = document.getElementById('frame-' + key);
  frame.srcdoc = SOURCES[key];
  loaded[key] = true;
}

function switchTab(key) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === key);
  });
  document.querySelectorAll('.test-frame').forEach(f => {
    f.classList.toggle('active', f.id === 'frame-' + key);
  });
  loadFrame(key);
}

// load the first tab on start
loadFrame('part1');
</script>
